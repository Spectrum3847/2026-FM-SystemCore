# This is a basic workflow to build robot code.

name: CI

# Triggers on push to main, and on ANY pull request regardless of target branch.
on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'

      # Caches Gradle dependencies and build outputs between runs
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Grant execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Check Java formatting (Spotless)
      - name: Check Java formatting (Spotless)
        run: ./gradlew spotlessCheck

      # Runs a single command using the runners shell
      - name: Compile and run tests on robot code
        run: ./gradlew build

  # Tuning mode lets dashboards change robot values; main must never have it on.
  tuning-mode:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: TUNING_MODE is false
        run: |
          if ! grep -Eq '^ *public static final boolean TUNING_MODE = false;' src/main/java/frc/robot/Constants.java; then
            echo "::error file=src/main/java/frc/robot/Constants.java::TUNING_MODE must be false to merge to main"
            exit 1
          fi

  # Each scripted sim runs in real time, then tools/ci_assert.py checks its log.
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: drive
            script: drive
          - name: shoot
            script: shoot
          - name: auto
            script: auto:TBTB Left
            check: --auto
    name: sim (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew shadowJar

      - name: Run the ${{ matrix.name }} sim
        env:
          FM_SIM_SCRIPT: ${{ matrix.script }}
          FM_SIM_EXIT: 1
        run: |
          set -o pipefail
          timeout 5m ./gradlew simulateJava -PnoSimGui 2>&1 | tee logs-console.txt

      - name: Check the log
        run: python3 tools/ci_assert.py logs/*.wpilog logs-console.txt ${{ matrix.check }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sim-${{ matrix.name }}
          path: |
            logs/*.wpilog
            logs-console.txt
          retention-days: 14

  # The robot app (src/main/deploy/app) is plain JavaScript; its tests need Node only.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Test the robot app
        run: node --test tools/app-test/*.test.mjs
