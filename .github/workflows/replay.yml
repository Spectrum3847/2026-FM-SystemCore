# Replays a real match log through the PR's code and through the base branch's, then fails if the
# fused pose or the shot gate's verdicts moved. Add the replay-change-expected label to a PR whose
# change is meant to move them. Fixture and limits: README "CI".

name: Replay

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: replay-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        side: [base, pr]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.side == 'base' && github.event.pull_request.base.sha || '' }}

      # Both sides replay the PR's fixture, so a PR may replace it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: pr-head
          sparse-checkout: src/test/resources/replay

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Replay the fixture
        run: |
          chmod +x gradlew
          mkdir -p "$RUNNER_TEMP/replay"
          cp pr-head/src/test/resources/replay/*.wpilog "$RUNNER_TEMP/replay/fixture.wpilog"
          FM_REPLAY=1 AKIT_LOG_PATH="$RUNNER_TEMP/replay/fixture.wpilog" \
            timeout 10m ./gradlew simulateJava -PnoSimGui

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replay-${{ matrix.side }}
          path: ${{ runner.temp }}/replay/fixture_sim.wpilog
          retention-days: 14

  compare:
    needs: replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: replays

      - name: Compare the PR's replay with the base branch's
        env:
          EXPECTED: ${{ contains(github.event.pull_request.labels.*.name, 'replay-change-expected') }}
        run: |
          if python3 tools/replay_regression.py replays/replay-base/fixture_sim.wpilog \
              replays/replay-pr/fixture_sim.wpilog; then
            exit 0
          elif [ "$EXPECTED" = "true" ]; then
            echo "::notice::Replay changed, as the replay-change-expected label says it should."
          else
            echo "::error::Replay changed. If that is intended, add the replay-change-expected label."
            exit 1
          fi
