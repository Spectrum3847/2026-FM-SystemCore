[default.extend-words]
# Quest "re-origin" is a domain term.
origined = "origined"
origining = "origining"
# PnP: Perspective-n-Point.
Pn = "Pn"

[default]
# grep patterns in build.gradle match partial words on purpose. Hex hashes (field-map hashes,
# SHA-256 test vectors) are not words.
extend-ignore-re = ['grep -E \\".*\\"', '\b[0-9a-f]{16,64}\b']

[default.extend-identifiers]
# The team's log site repo is named this way.
Analizer = "Analizer"

[files]
# Vendored minified libraries, and camera output captured verbatim.
extend-exclude = ["src/main/deploy/app/vendor/", "tools/app-test/fixtures/"]
