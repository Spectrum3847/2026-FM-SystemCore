plugins {
    id "java"
    id "org.wpilib.GradleRIO" version "2027.0.0-alpha-6"
    id "com.gradleup.shadow" version "9.3.0"
    id "com.peterabeles.gversion" version "1.10"
    id "com.diffplug.spotless" version "8.6.0"
    id "io.freefair.lombok" version "9.5.0"
    id "net.ltgt.errorprone" version "5.1.1"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

def ROBOT_MAIN_CLASS = "frc.robot.Main"

// Define my targets (SystemCore) and artifacts (deployable files).
// From the WPILib 2027 alpha-6 Java template / AdvantageKit 27.0.0-alpha-4 skeleton.
deploy {
    targets {
        systemcore(getTargetTypeClass('SystemCore')) {
            // Team number is loaded from .wpilib/wpilib_preferences.json (8515 for FM's
            // October event) or from the command line.
            team = project.wpilib.getTeamNumber()
            // Must be called after setting team.
            useDefaultSystemcoreHostName()
            debug = project.wpilib.getDebugOrDefault(false)

            artifacts {
                wpilibJava(getArtifactTypeClass('WPILibJavaArtifact')) {
                }

                // Static files artifact
                wpilibStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/systemcore/deploy'
                    deleteOldFiles = true
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.systemcore.artifacts.wpilibJava

// Set to true to use debug for all targets including JNI, which will drastically impact
// performance.
wpi.java.debugJni = false

// Desktop support on: the physics sim and AdvantageKit replay both run on the desktop.
def includeDesktopSupport = true

repositories {
    mavenCentral()
}

// AdvantageKit log replay: `./gradlew replayWatch` re-runs replay whenever the code changes.
task(replayWatch, type: JavaExec) {
    mainClass = "org.littletonrobotics.junction.ReplayWatch"
    classpath = sourceSets.main.runtimeClasspath
}

dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    systemcoreDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.systemcore)
    systemcoreDebug wpi.java.vendor.jniDebug(wpi.platforms.systemcore)

    systemcoreRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.systemcore)
    systemcoreRelease wpi.java.vendor.jniRelease(wpi.platforms.systemcore)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    // LimelightHelpers parses Limelight JSON with Jackson; WPILib 2027 does not ship it.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.2'

    errorprone 'com.google.errorprone:error_prone_core:2.50.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    def akitJson = new groovy.json.JsonSlurper().parseText(new File(projectDir.getAbsolutePath() + "/vendordeps/AdvantageKit.json").text)
    annotationProcessor "org.littletonrobotics.akit:akit-autolog:$akitJson.version"
}

test {
    useJUnitPlatform {
        excludeTags 'sim'
    }
    // src/test also holds desktop tools (frc.tools.NtDump) that are not tests.
    failOnNoDiscoveredTests = false
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

// Tests tagged "sim" boot the whole robot in simulation. They get their own JVM because they start
// the logger, pause the sim clock and fill the command scheduler, which the unit tests don't expect;
// and one JVM per class, since a robot boots once per JVM.
def simTest = tasks.register('simTest', Test) {
    group = 'verification'
    description = 'Boots the robot in simulation: every binding, and SuperStructure sequences (tests tagged sim).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    forkEvery = 1
    useJUnitPlatform {
        includeTags 'sim'
    }
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    testLogging {
        events 'failed'
        showStandardStreams = false
        exceptionFormat = 'full'
    }
    shouldRunAfter test
}
check.dependsOn simTest

// Simulation configuration.
//
// The sim GUI is on by default so `./gradlew simulateJava` gives a drivable robot. AdvantageKit
// replay requires every HAL sim extension to be off: run replay with
// `./gradlew simulateJava -PnoSimGui` (see README), which turns the GUI off.
wpi.sim.addGui().defaultEnabled = !project.hasProperty('noSimGui')
wpi.sim.addDriverstation()

// Fat jar: every library in the main jar, service files merged so JSON works.
shadowJar {
    mergeServiceFiles()
    from('src') { into 'backup/src' }
    from('vendordeps') { into 'backup/vendordeps' }
    from('build.gradle') { into 'backup' }
    manifest org.wpilib.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Configure jar and deploy tasks
deployArtifact.jarTask = shadowJar
wpi.java.configureExecutableTasks(shadowJar)
wpi.java.configureTestTasks(test)
wpi.java.configureTestTasks(simTest.get())

// Configure string concat to always inline compile
tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '3000'])
}

// Error Prone on main code: its errors fail the compile, its warnings only print. Checks that
// flag a deliberate pattern or pure style are off, so the warnings left are worth fixing.
tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        disableWarningsInGeneratedCode = true
        // LimelightHelpers is Limelight's file, kept as shipped.
        excludedPaths = '.*/build/generated/.*|.*/LimelightHelpers\\.java'
        // Javadoc formatting; javadoc.yml builds the docs.
        disable("UnrecognisedJavadocTag", "NotJavadoc", "EmptyBlockTag")
        // Style only.
        disable("StatementSwitchToExpressionSwitch", "UnnecessaryParentheses", "StringSplitter",
                "ArrayRecordComponent", "InlineMeSuggester", "RefactorSwitch")
        // Commands, threads and pose sources are compared by identity on purpose; enums hold
        // geometry (Pose2d), which is immutable but not annotated.
        disable("ReferenceEquality", "ImmutableEnumChecker")
        // BackgroundSampler's scheduled task catches its own exceptions, so its Future is unused.
        disable("FutureReturnValueIgnored")
        // Robot.java hands out subsystems through static fields set in its constructor.
        disable("StaticAssignmentInConstructor")
        // Mechanism subclasses narrow `config` to their own Config type.
        disable("HidingField")
        // Inputs and the sim script index enums by ordinal; background threads set their
        // priority on purpose.
        disable("EnumOrdinal", "ThreadPriorityCheck")
    }
}
compileTestJava.options.errorprone.enabled = false

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
    exclude '**/*.md'
    options.setLinks([
        "https://github.wpilib.org/allwpilib/docs/development/java",
        "https://api.ctr-electronics.com/phoenix6/latest/java",
        "https://docs.advantagekit.org/javadoc",
        "https://docs.oracle.com/en/java/javase/25/docs/api"
    ])
}

// Create version file
project.compileJava.dependsOn(createVersionFile)
gversion {
    srcDir       = "src/main/java/"
    classPackage = "frc.robot"
    className    = "BuildConstants"
    dateFormat   = "yyyy-MM-dd HH:mm:ss z"
    timeZone     = "America/Chicago"
    indent       = "  "
}

// Create commit with working changes on event branches
task(eventDeploy) {
    doLast {
        if (project.gradle.startParameter.taskNames.any({ it.toLowerCase().contains("deploy") })) {
            def branchPrefix = "event"
            def branch = 'git branch --show-current'.execute().text.trim()
            def commitMessage = "Update at '${new Date().toString()}'"

            if (branch.startsWith(branchPrefix)) {
                exec {
                    workingDir(projectDir)
                    executable 'git'
                    args 'add', '-A'
                }
                exec {
                    workingDir(projectDir)
                    executable 'git'
                    args 'commit', '-m', commitMessage
                    ignoreExitValue = true
                }

                println "Committed to branch: '$branch'"
                println "Commit message: '$commitMessage'"
            } else {
                println "Not on an event branch, skipping commit"
            }
        } else {
            println "Not running deploy task, skipping commit"
        }
    }
}
createVersionFile.dependsOn(eventDeploy)

// Spotless: Google Java Format, AOSP style (4-space indent), same as 2026-Spectrum.
// Style Guide: https://source.android.com/docs/setup/contribute/code-style#java-style-rules
project.compileJava.dependsOn(spotlessApply)
spotless {
    java {
        target fileTree('.') {
            include '**/*.java'
            exclude '**/build/**', '**/build-*/**', '**/BuildConstants.java'
        }
        toggleOffOn()
        googleJavaFormat("1.28.0").aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle {
        target fileTree('.') {
            include '**/*.gradle'
            exclude '**/build/**', '**/build-*/**'
        }
        greclipse()
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.register('printClasspath') {
    doLast {
        configurations.runtimeClasspath.each {
            println it
        }
    }
}

// Prints a robot's NetworkTables topics: ./gradlew ntDump -Phost=172.26.0.1 -Pprefix=/AdvantageKit
tasks.register('ntDump', JavaExec) {
    group = 'Spectrum'
    description = 'Dump NetworkTables topics from a robot (-Phost, -Pprefix, -PwaitMs, -Pset=/key=bool)'
    dependsOn 'testClasses', 'extractReleaseNative'
    mainClass = 'frc.tools.NtDump'
    classpath = sourceSets.test.runtimeClasspath
    def nativeDir = file("$buildDir/jni/release")
    jvmArgs = [
        "-Djava.library.path=${nativeDir}",
        "-Dntdump.waitMs=${project.findProperty('waitMs') ?: 6000}",
        "-Dntdump.set=${project.findProperty('set') ?: ''}"
    ]
    environment 'PATH', "${nativeDir}${File.pathSeparator}${System.getenv('PATH')}"
    args = [
        project.findProperty('host') ?: '172.26.0.1'
    ] + ((project.findProperty('prefix') ?: '/').toString().split(',') as List)
}

// Prints the robot program's console output since boot from the SystemCore (filtered to the
// interesting lines), then restarts the program. GradleRIO stops it before any artifact runs:
//   ./gradlew deployrobotLogsystemcore -ProbotLog --info
// Uses the deploy connection, so it needs nothing beyond what ./gradlew deploy needs.
// -ProbotLogAll prints the last 300 lines unfiltered instead; -ProbotThreads runs
// tools/robot_threads.sh (per-thread CPU and the library each busy thread is in);
// -ProbotTop runs tools/robot_top.sh (system-wide top with the robot program running).
if (project.hasProperty('robotLog')) {
    def filter = project.hasProperty('robotLogAll') ? "tail -300" :
            "grep -E \"Threads]|TIME:|Exception|rror|at frc|Started|Stopp|AdvantageKit|NT: \" | tail -150"
    deploy.targets.systemcore.artifacts {
        robotLog(deploy.targets.systemcore.getArtifactTypeClass('CommandArtifact')) {
            command = project.hasProperty('robotThreads') ? file('tools/robot_threads.sh').text :
                    project.hasProperty('robotTop') ? file('tools/robot_top.sh').text :
                    "journalctl -u robot -b --no-pager 2>&1 | ${filter}; sudo systemctl start robot"
        }
    }
}
